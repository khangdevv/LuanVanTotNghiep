[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartschedule-engine"
version = "0.1.0"
description = "FastAPI scheduling engine for SmartSchedule"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.0,<3.0",
    "ortools>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.6,<1.0",
]

[tool.setuptools]
py-modules = [
    "csp_generator",
    "data_loader",
    "detect_conflicts",
    "scoring_function",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["models*", "enums*", "demo*", "routers*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
